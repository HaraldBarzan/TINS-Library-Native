name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            triplet: x64-windows
          - rid: linux-x64
            os: ubuntu-latest
            triplet: x64-linux-dynamic
          - rid: osx-x64
            os: macos-13
            triplet: x64-osx-dynamic
          - rid: osx-arm64
            os: macos-14
            triplet: arm64-osx-dynamic

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.rid }}

    steps:
      # fetch-depth: 0 (full history) is required for MinVer to compute a correct commit
      # height. The default shallow (depth-1) checkout only shows one commit, so MinVer
      # can't count commits-since-tag and silently produces a version with no height
      # component at all (confirmed: a real CI pack produced "0.0.0-alpha.1.nupkg" instead
      # of the expected "0.0.0-alpha.1.<height>.nupkg" every local build actually gets).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # fftw3's (and, now that LAPACK is enabled, openblas's lapack-netlib) bundled
      # CMakeLists.txt predate CMake 3.5 and were never updated -- CMake 4.x (what
      # GitHub-hosted runners ship by default) hard-removed compatibility with that.
      # Setting CMAKE_POLICY_VERSION_MINIMUM as a plain env var does NOT fix this: vcpkg
      # does not forward arbitrary env vars into the per-port cmake.exe invocations it
      # spawns (confirmed -- the exact same failure recurred with that var set). Pinning
      # an older CMake here instead, matching the version vcpkg's own local bootstrap used
      # successfully, so vcpkg picks this one up when it resolves which CMake to use.
      - name: Install a pre-CMake-4 toolchain (fftw3/lapack-netlib compatibility)
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.30.1"

      # lukka/run-vcpkg defaults VCPKG_BINARY_SOURCES to the GitHub Actions cache backend
      # (x-gha), which needs these two env vars exported -- they exist in the workflow run's
      # context but aren't exposed to shell steps automatically. Without this, "vcpkg install"
      # fails immediately with "GHA binary source requires the ACTIONS_RUNTIME_TOKEN and
      # ACTIONS_CACHE_URL environment variables to be set."
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "vcpkg.json"
          # Without this, run-vcpkg checks out its own bundled default vcpkg commit (Feb
          # 2025 vintage as of this writing), whose scripts/cmake/vcpkg_acquire_msys.cmake
          # references an msys2-runtime package build that mirrors have since pruned (all
          # 6 mirrors returned 404, confirmed in a real CI run). Pinning a current tagged
          # release instead gets fresh, currently-valid download URLs. This is independent
          # of vcpkg-configuration.json's builtin-baseline (that only governs port-version
          # resolution against the registry, not which vcpkg-tool/scripts commit gets
          # checked out) -- deliberately left alone here, since bumping it too would need
          # our openblas overlay's pinned 0.3.29 reconciled against this newer baseline's
          # 0.3.33 expectation, which isn't needed just to fix this download failure.
          vcpkgGitCommitId: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

      - name: vcpkg install (${{ matrix.triplet }})
        shell: pwsh
        run: |
          ${{ env.VCPKG_ROOT }}/vcpkg install --triplet ${{ matrix.triplet }} --x-install-root=${{ github.workspace }}/vcpkg_installed

      - name: Stage native assets
        shell: pwsh
        run: |
          ./scripts/stage-native.ps1 -Triplet ${{ matrix.triplet }} -Rid ${{ matrix.rid }} `
            -VcpkgInstalledRoot ${{ github.workspace }}/vcpkg_installed

      - name: Pack TINS.Native.${{ matrix.rid }}
        shell: pwsh
        run: |
          dotnet pack pack/TINS.Native.${{ matrix.rid }}/TINS.Native.${{ matrix.rid }}.csproj `
            -c Release -o artifacts/nupkg

      - name: Smoke test
        shell: pwsh
        run: |
          dotnet nuget add source "${{ github.workspace }}/artifacts/nupkg" --name local-native

          # --prerelease (no explicit version) failed against this freshly-added local
          # folder source in a real CI run ("There are no versions available for the
          # package"), even though the nupkg was sitting right there -- every manual
          # verification of this whole pipeline used an explicit --version instead, so
          # this extracts the exact version from the nupkg just built and pins to that.
          $nupkg = Get-ChildItem "artifacts/nupkg/TINS.Native.${{ matrix.rid }}.*.nupkg" | Select-Object -First 1
          $version = $nupkg.BaseName -replace "^TINS\.Native\.${{ matrix.rid }}\.", ""
          Write-Host "Smoke-testing TINS.Native.${{ matrix.rid }} version $version"

          dotnet add smoke/Tins.Native.Smoke.csproj package TINS.Native.${{ matrix.rid }} --version $version --source local-native
          dotnet run --project smoke/Tins.Native.Smoke.csproj -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: TINS.Native.${{ matrix.rid }}
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error
