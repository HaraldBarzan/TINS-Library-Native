name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            triplet: x64-windows
          - rid: linux-x64
            os: ubuntu-latest
            triplet: x64-linux-dynamic
          # osx-x64 is EXCLUDED (not just paused for quota -- see CLAUDE.md's Status section,
          # 2026-09-24). Originally commented out just because this repo's free Actions minutes
          # were exhausted standing up the other three legs, and most Macs running this today are
          # Apple Silicon anyway. But the runner this leg targeted, macos-13, has since been fully
          # deprecated by GitHub, and its replacement (macos-15-intel) is NOT available on the
          # GitHub Free plan at all -- a plan-tier lockout, not something quota resetting fixes.
          # pack/TINS.Native.osx-x64/ and the RID package itself are untouched in the codebase, but
          # don't just uncomment this leg expecting it to work -- it needs a paid GitHub plan, a
          # self-hosted runner, or real Intel Mac hardware, plus updating the runner label below
          # (macos-13 no longer exists) before it could even be attempted.
          # - rid: osx-x64
          #   os: macos-13
          #   triplet: x64-osx-dynamic
          - rid: osx-arm64
            os: macos-14
            triplet: arm64-osx-dynamic

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.rid }}

    steps:
      # fetch-depth: 0 (full history) is required for MinVer to compute a correct commit
      # height. The default shallow (depth-1) checkout only shows one commit, so MinVer
      # can't count commits-since-tag and silently produces a version with no height
      # component at all (confirmed: a real CI pack produced "0.0.0-alpha.1.nupkg" instead
      # of the expected "0.0.0-alpha.1.<height>.nupkg" every local build actually gets).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # lukka/run-vcpkg defaults VCPKG_BINARY_SOURCES to the GitHub Actions cache backend
      # (x-gha), which needs these two env vars exported -- they exist in the workflow run's
      # context but aren't exposed to shell steps automatically. Without this, "vcpkg install"
      # fails immediately with "GHA binary source requires the ACTIONS_RUNTIME_TOKEN and
      # ACTIONS_CACHE_URL environment variables to be set."
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "vcpkg.json"
          # Without this, run-vcpkg checks out its own bundled default vcpkg commit (Feb
          # 2025 vintage as of this writing), whose scripts/cmake/vcpkg_acquire_msys.cmake
          # references an msys2-runtime package build that mirrors have since pruned (all
          # 6 mirrors returned 404, confirmed in a real CI run). Pinning a current tagged
          # release instead gets fresh, currently-valid download URLs. This is independent
          # of vcpkg-configuration.json's builtin-baseline (that only governs port-version
          # resolution against the registry, not which vcpkg-tool/scripts commit gets
          # checked out) -- deliberately left alone here, since bumping it too would need
          # our openblas overlay's pinned 0.3.29 reconciled against this newer baseline's
          # 0.3.33 expectation, which isn't needed just to fix this download failure.
          vcpkgGitCommitId: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

      - name: vcpkg install (${{ matrix.triplet }})
        shell: pwsh
        run: |
          ${{ env.VCPKG_ROOT }}/vcpkg install --triplet ${{ matrix.triplet }} --x-install-root=${{ github.workspace }}/vcpkg_installed

      # Staged (and later packed/smoke-tested) as two separate license-tracked package
      # families -- see CLAUDE.md's decision on the FFTW/core split. Core is
      # BSD-3-Clause (OpenBLAS + the pocketfft-shim/ build below); Fftw is
      # GPL-2.0-or-later and strictly opt-in for a consumer.
      - name: Stage native assets (core)
        shell: pwsh
        run: |
          ./scripts/stage-native.ps1 -Triplet ${{ matrix.triplet }} -Rid ${{ matrix.rid }} -Component Core `
            -VcpkgInstalledRoot ${{ github.workspace }}/vcpkg_installed

      - name: Stage native assets (fftw)
        shell: pwsh
        run: |
          ./scripts/stage-native.ps1 -Triplet ${{ matrix.triplet }} -Rid ${{ matrix.rid }} -Component Fftw `
            -VcpkgInstalledRoot ${{ github.workspace }}/vcpkg_installed

      # Not a vcpkg overlay port -- pocketfft-shim/ is our own first-party source, built with a
      # plain CMakeLists.txt that only needs vcpkg to have vendored pocketfft_hdronly.h (a real,
      # unmodified vcpkg registry port, added as a manifest dependency above). Output goes straight
      # into the same core staging folder as OpenBLAS, so one "Pack TINS.Native.<rid>" step below
      # picks up both.
      - name: Build pocketfft shim (core)
        shell: pwsh
        run: |
          ./scripts/build-pocketfft-shim.ps1 -Rid ${{ matrix.rid }} `
            -PocketfftIncludeDir ${{ github.workspace }}/vcpkg_installed/${{ matrix.triplet }}/include

      - name: Pack TINS.Native.${{ matrix.rid }}
        shell: pwsh
        run: |
          dotnet pack pack/TINS.Native.${{ matrix.rid }}/TINS.Native.${{ matrix.rid }}.csproj `
            -c Release -o artifacts/nupkg

      - name: Pack TINS.Native.FFTW.${{ matrix.rid }}
        shell: pwsh
        run: |
          dotnet pack pack/TINS.Native.FFTW.${{ matrix.rid }}/TINS.Native.FFTW.${{ matrix.rid }}.csproj `
            -c Release -o artifacts/nupkg

      - name: Smoke test (core)
        shell: pwsh
        run: |
          dotnet nuget add source "${{ github.workspace }}/artifacts/nupkg" --name local-native

          # --prerelease (no explicit version) failed against this freshly-added local
          # folder source in a real CI run ("There are no versions available for the
          # package"), even though the nupkg was sitting right there -- every manual
          # verification of this whole pipeline used an explicit --version instead, so
          # this extracts the exact version from the nupkg just built and pins to that.
          $nupkg = Get-ChildItem "artifacts/nupkg/TINS.Native.${{ matrix.rid }}.*.nupkg" | Select-Object -First 1
          $version = $nupkg.BaseName -replace "^TINS\.Native\.${{ matrix.rid }}\.", ""
          Write-Host "Smoke-testing TINS.Native.${{ matrix.rid }} version $version"

          # No --source here: passing the registered source NAME ("local-native") to
          # `dotnet add package --source` doesn't resolve it as that named source -- it's
          # treated as a literal path instead, which then doesn't exist, and restore fails
          # with NU1301 (confirmed in a real CI run). The source is already registered
          # above via `dotnet nuget add source --name local-native`, so it's already part
          # of the default set for this restore without needing --source at all -- this
          # matches the CLAUDE.md-documented gotcha with dotnet add package --source.
          dotnet add smoke/Tins.Native.Smoke.csproj package TINS.Native.${{ matrix.rid }} --version $version
          dotnet run --project smoke/Tins.Native.Smoke.csproj -c Release -- core

          # Isolated on purpose: prove the core package alone resolves OpenBLAS and does
          # NOT depend on FFTW being present, before the FFTW package is added below.
          dotnet remove smoke/Tins.Native.Smoke.csproj package TINS.Native.${{ matrix.rid }}

      - name: Smoke test (fftw)
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem "artifacts/nupkg/TINS.Native.FFTW.${{ matrix.rid }}.*.nupkg" | Select-Object -First 1
          $version = $nupkg.BaseName -replace "^TINS\.Native\.FFTW\.${{ matrix.rid }}\.", ""
          Write-Host "Smoke-testing TINS.Native.FFTW.${{ matrix.rid }} version $version"

          dotnet add smoke/Tins.Native.Smoke.csproj package TINS.Native.FFTW.${{ matrix.rid }} --version $version
          dotnet run --project smoke/Tins.Native.Smoke.csproj -c Release -- fftw
          dotnet remove smoke/Tins.Native.Smoke.csproj package TINS.Native.FFTW.${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: TINS.Native.${{ matrix.rid }}
          path: artifacts/nupkg/TINS.Native.${{ matrix.rid }}.*.nupkg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: TINS.Native.FFTW.${{ matrix.rid }}
          path: artifacts/nupkg/TINS.Native.FFTW.${{ matrix.rid }}.*.nupkg
          if-no-files-found: error

  # TINS.Native.Desktop / TINS.Native.FFTW.Desktop were never packed in CI at all before this --
  # only ever packed manually, locally. Runs after every matrix leg succeeds (needs: build waits
  # for the whole matrix), on every push, not just tag pushes: cheap (no native build, just
  # restore+pack) and it means a broken Desktop package restore gets caught immediately instead
  # of only at release time.
  pack-desktop:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v4
        with:
          pattern: "TINS.Native.*"
          path: artifacts/nupkg
          merge-multiple: true

      # TINS.Native.Desktop / TINS.Native.FFTW.Desktop pin an explicit version floor on their
      # sibling RID packages instead of $(Version) (see that project's own comment for why).
      # Before the first real release tag, nothing at that floor -- or anywhere else under the
      # TINS.Native.* ID family -- has ever been published anywhere; the only packages that
      # satisfy it are the ones this same CI run just built, downloaded above. Registering that
      # folder as an ADDITIONAL restore source (not a replacement -- restore also needs nuget.org
      # for MinVer itself) makes those freshly built siblings resolvable, the same pattern the
      # smoke test steps above already use for the same reason.
      #
      # IMPORTANT for whoever cuts a real release: bump these two csproj's PackageReference
      # versions to match a real, already-published sibling version BEFORE pushing a new tag, per
      # Decision 8 in CLAUDE.md -- this job's local-source trick only makes THIS run's pack step
      # resolve correctly, it doesn't fix the floor baked into the published nuspec. Forgetting
      # this once (v1.0.0 -> v1.0.1, 2026-09-24) is exactly why the verification step below exists
      # now: it queries nuget.org for each floor and fails the job if any floor version was never
      # actually published, instead of silently shipping a stale reference again.
      - name: Register just-built packages as a restore source
        run: dotnet nuget add source "${{ github.workspace }}/artifacts/nupkg" --name just-built-native

      - name: Pack TINS.Native.Desktop
        run: dotnet pack pack/TINS.Native.Desktop/TINS.Native.Desktop.csproj -c Release -o artifacts/nupkg

      - name: Pack TINS.Native.FFTW.Desktop
        run: dotnet pack pack/TINS.Native.FFTW.Desktop/TINS.Native.FFTW.Desktop.csproj -c Release -o artifacts/nupkg

      # Guard rail added 2026-09-24 after the exact failure it checks for actually happened: the
      # v1.0.0 tag shipped TINS.Native.Desktop/FFTW.Desktop still pinned to a pre-release floor
      # (0.0.0-alpha.1.22) that was never published to nuget.org at all (publishing used to be
      # local-artifact-only -- see Decision 3), producing a permanent NU1603 warning on every
      # consumer restore. Extracts every <dependency id, version> pair from both just-packed
      # nuspecs and confirms each exact version string is actually present on nuget.org's
      # v3-flatcontainer index for that package id -- not just "some version exists", the EXACT
      # floor. A floor that's satisfied only by resolving upward past it (like alpha.1.22 was)
      # means this check would have failed loudly here instead of shipping silently.
      - name: Verify Desktop dependency floors are actually published
        shell: pwsh
        run: |
          $failed = $false
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $nupkgs = Get-ChildItem "artifacts/nupkg/TINS.Native.Desktop.*.nupkg", "artifacts/nupkg/TINS.Native.FFTW.Desktop.*.nupkg"
          foreach ($nupkg in $nupkgs) {
            try {
              # Expand-Archive refuses a .nupkg extension outright ("only .zip is supported"),
              # despite a nupkg being an ordinary zip -- confirmed by hitting this for real while
              # testing this exact step. ZipFile.ExtractToDirectory has no such extension check.
              $extractDir = Join-Path ([System.IO.Path]::GetTempPath()) ([System.IO.Path]::GetRandomFileName())
              [System.IO.Compression.ZipFile]::ExtractToDirectory($nupkg.FullName, $extractDir)
              $nuspecFile = Get-ChildItem $extractDir -Filter *.nuspec -ErrorAction Stop | Select-Object -First 1
              if (-not $nuspecFile) { throw "no .nuspec found inside $($nupkg.Name)" }
              [xml]$nuspec = Get-Content $nuspecFile.FullName -ErrorAction Stop
            } catch {
              # Deliberately fails the check on ANY inspection error rather than silently
              # skipping it -- an earlier draft of this script let unhandled Expand-Archive/
              # Get-Content errors fall through uncaught, which left $failed permanently false
              # (a guard rail that always reports success is worse than no guard rail at all).
              Write-Host "::error::Failed to inspect $($nupkg.Name): $_"
              $failed = $true
              continue
            }
            $deps = $nuspec.package.metadata.dependencies.group.dependency
            foreach ($dep in $deps) {
              $id = $dep.id
              $version = $dep.version
              $indexUrl = "https://api.nuget.org/v3-flatcontainer/$($id.ToLowerInvariant())/index.json"
              try {
                $published = (Invoke-RestMethod -Uri $indexUrl -ErrorAction Stop).versions
              } catch {
                Write-Host "::error::Could not query nuget.org for '$id' (required by $($nupkg.Name)): $_"
                $failed = $true
                continue
              }
              if ($published -notcontains $version) {
                Write-Host "::error::$($nupkg.Name) depends on '$id >= $version', but $id $version has never been published to nuget.org. Bump the PackageReference floor in the matching .csproj to a real, published sibling version before tagging a release (see CLAUDE.md Decision 8/9)."
                $failed = $true
              } else {
                Write-Host "OK: $id $version is published on nuget.org (required by $($nupkg.Name))"
              }
            }
          }
          if ($failed) {
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: TINS.Native.Desktop
          path: artifacts/nupkg/TINS.Native.Desktop.*.nupkg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: TINS.Native.FFTW.Desktop
          path: artifacts/nupkg/TINS.Native.FFTW.Desktop.*.nupkg
          if-no-files-found: error

  # Only runs for a real release tag (vX.Y.Z, per Decision 7's MinVerTagPrefix), and only once
  # every matrix leg AND the Desktop packing job have succeeded (needs: [build, pack-desktop]) --
  # a push that isn't a version tag never reaches this job at all, so day-to-day commits/PRs never
  # risk touching nuget.org.
  publish:
    needs: [build, pack-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC), not a long-lived API key -- nuget.org's now-recommended approach
    # (superseded the API-key design this job originally had). id-token: write is what lets this
    # job request the GitHub-signed OIDC token that NuGet/login below exchanges for a short-lived
    # (1 hour) nuget.org API key; without this permission the token request silently fails. Job-
    # level `permissions:` REPLACES the default set rather than adding to it, so this job gets
    # nothing else (no contents:read etc.) -- fine, it doesn't check the repo out or need anything
    # beyond downloading this run's own artifacts and pushing them.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "TINS.Native.*"
          path: artifacts/nupkg
          merge-multiple: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Exchanges this job's OIDC token for a short-lived nuget.org API key -- requires a Trusted
      # Publishing policy configured on nuget.org first (Repository Owner: HaraldBarzan,
      # Repository: TINS-Library-Native, Workflow File: ci.yml -- filename only, not the
      # .github/workflows/ path; see NUGET-PUBLISH-CHECKLIST.md). No NUGET_API_KEY secret needed
      # at all with this approach, unlike the design this replaced. `user` is the nuget.org
      # profile username (not email) that owns the policy -- stored as a secret per NuGet's own
      # docs recommendation, though it isn't a credential itself, just an identifier.
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      # --skip-duplicate makes re-running a partially-failed publish safe: already-pushed versions
      # are silently skipped instead of erroring the whole job.
      - name: Publish to nuget.org
        run: |
          dotnet nuget push "artifacts/nupkg/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --skip-duplicate
